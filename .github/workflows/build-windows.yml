name: Build Windows Portable EXE

on:
  workflow_dispatch:
  push:
    branches:
      - shobhaexe
    paths-ignore:
      - "releases/windows/**"
      - "releases/windows/.gitattributes"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build portable EXE
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          ./build_windows.ps1

      - name: Create release ZIP files
        shell: pwsh
        run: |
          $APPNAME = (Select-String -Path build_windows.ps1 -Pattern '\$APPNAME\s*=\s*"(\w+)"').Matches[0].Groups[1].Value

          if (!(Test-Path "release\README_CLIENT.md") -and (Test-Path "README_CLIENT.md")) {
            Copy-Item README_CLIENT.md release\README_CLIENT.md -Force
          }

          $appZipItems = @(
            "release\$APPNAME.exe",
            "release\config.json",
            "release\README_CLIENT.md"
          )
          if (Test-Path "release\sobha_logo_brand.png") {
            $appZipItems += "release\sobha_logo_brand.png"
          }

          $portableZipItems = @(
            "release\$APPNAME.exe",
            "release\config.json",
            "release\README_CLIENT.md",
            "release\pw-browsers"
          )
          if (Test-Path "release\sobha_logo_brand.png") {
            $portableZipItems = @(
              "release\$APPNAME.exe",
              "release\config.json",
              "release\README_CLIENT.md",
              "release\sobha_logo_brand.png",
              "release\pw-browsers"
            )
          }

          Compress-Archive -Path $appZipItems `
            -DestinationPath release\sobha-app-only.zip -Force

          Compress-Archive -Path release\pw-browsers `
            -DestinationPath release\sobha-pw-browsers.zip -Force

          Compress-Archive -Path $portableZipItems `
            -DestinationPath release\sobha-windows-portable.zip -Force

          New-Item -ItemType Directory -Force -Path releases/windows | Out-Null
          Copy-Item release\sobha-app-only.zip releases/windows\ -Force
          Copy-Item release\sobha-pw-browsers.zip releases/windows\ -Force
          Copy-Item release\sobha-windows-portable.zip releases/windows\ -Force

          @"
          {
            "run_number": ${{ github.run_number }},
            "run_id": "${{ github.run_id }}",
            "sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "built_at_utc": "$(Get-Date -Format o)"
          }
          "@ | Set-Content releases/windows/build-info.json -Encoding utf8

      - name: Upload release folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sobha-release
          path: release/**
          retention-days: 30

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: sobha-windows-portable
          path: releases/windows/sobha-windows-portable.zip
          retention-days: 30

      - name: Commit release ZIPs to repo
        shell: bash
        run: |
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/windows/
          if git diff --staged --quiet; then
            echo "No release file changes to commit."
            exit 0
          fi
          git commit -m "ci: update Windows portable build zips (run ${{ github.run_number }})"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: "Sobha Windows Build ${{ github.run_number }}"
          body: |
            ## Windows test package

            ### Recommended
            Download **sobha-windows-portable.zip** — contains everything needed to test on Windows.

            ### Split downloads
            1. **sobha-app-only.zip** — exe + config + readme
            2. **sobha-pw-browsers.zip** — Playwright Chromium browsers
            3. Extract both into the same folder if using split downloads

            Built from branch `${{ github.ref_name }}` at `${{ github.sha }}`.
          files: |
            releases/windows/sobha-windows-portable.zip
            releases/windows/sobha-app-only.zip
            releases/windows/sobha-pw-browsers.zip
          draft: false
          prerelease: false
