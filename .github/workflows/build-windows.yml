name: Build Windows EXE and MSI

on:
  workflow_dispatch:
  push:
    branches:
      - shobhaexe-msi
    paths-ignore:
      - "releases/windows/**"
      - "releases/windows/.gitattributes"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup .NET (WiX)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build portable EXE
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          ./build_windows.ps1 -SkipMsi

      - name: Build MSI installer
        continue-on-error: true
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          ./installer/build_msi.ps1 `
            -SourceDir "$PWD\release\sobha-app" `
            -OutputMsi "$PWD\release\sobha-setup.msi" `
            -LogFile "$PWD\release\msi-build.log"

      - name: Publish release artifacts to releases/windows
        if: always()
        shell: pwsh
        run: |
          if (!(Test-Path "release\sobha-windows-portable.zip")) {
            Write-Error "Portable ZIP was not created."
          }

          New-Item -ItemType Directory -Force -Path releases/windows | Out-Null
          Copy-Item release\sobha-windows-portable.zip releases/windows/ -Force
          Copy-Item release\sobha-app-only.zip releases/windows/ -Force
          Copy-Item release\sobha-pw-browsers.zip releases/windows/ -Force

          if (Test-Path "release\msi-build.log") {
            Copy-Item release\msi-build.log releases/windows/ -Force
          }

          $info = [ordered]@{
            run_number = ${{ github.run_number }}
            run_id = "${{ github.run_id }}"
            sha = "${{ github.sha }}"
            branch = "${{ github.ref_name }}"
            built_at_utc = (Get-Date -Format o)
            portable_zip_file = "sobha-windows-portable.zip"
            portable_zip_size_bytes = (Get-Item "release\sobha-windows-portable.zip").Length
          }

          if (Test-Path "release\sobha-setup.msi") {
            Copy-Item release\sobha-setup.msi releases/windows/ -Force
            $info.msi_file = "sobha-setup.msi"
            $info.msi_size_bytes = (Get-Item "release\sobha-setup.msi").Length
          } else {
            $info.msi_file = $null
            $info.msi_size_bytes = 0
            $info.msi_build_failed = $true
          }

          ($info | ConvertTo-Json -Depth 4) | Set-Content releases/windows/build-info.json -Encoding utf8

      - name: Upload release folder as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sobha-release
          path: release/**
          retention-days: 30

      - name: Upload portable ZIP artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sobha-windows-portable
          path: releases/windows/sobha-windows-portable.zip
          retention-days: 30

      - name: Upload MSI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sobha-setup-msi
          path: releases/windows/sobha-setup.msi
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit release artifacts to repo
        if: always()
        shell: bash
        run: |
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/windows/
          if git diff --staged --quiet; then
            echo "No release file changes to commit."
            exit 0
          fi
          git commit -m "ci: update Windows EXE and MSI build artifacts (run ${{ github.run_number }})"
          git push

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: "Sobha Windows Build ${{ github.run_number }}"
          body: |
            ## Windows packages

            ### Recommended for testing (portable)
            Download **sobha-windows-portable.zip** — extract fully, then double-click `sobha.exe`.

            ### Recommended for install (MSI)
            Download **sobha-setup.msi** — double-click to install, then open from Start Menu.

            ### Split downloads
            1. **sobha-app-only.zip** — exe + config + readme
            2. **sobha-pw-browsers.zip** — Playwright Chromium browsers
            3. Extract both into the same folder if using split downloads

            Built from branch `${{ github.ref_name }}` at `${{ github.sha }}`.
          files: |
            releases/windows/sobha-windows-portable.zip
            releases/windows/sobha-setup.msi
            releases/windows/sobha-app-only.zip
            releases/windows/sobha-pw-browsers.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
